# The app's Post on GitHub instead fills in this form by its file name and field ids
# (ISSUE_FORMS in src/lib/feedback.ts and the shell's src-tauri/src/feedback.rs), in every
# copy already installed, so keep both.
name: Feature request
description: Something Strandivo could do
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What you're trying to do
      description: The task in the lab, not the button you'd add. It helps us find where it fits.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: In Strandivo, another program, or by hand.
  - type: textarea
    id: idea
    attributes:
      label: What would help

# The app's Post on GitHub instead fills in this form by its file name and field ids
# (ISSUE_FORMS in src/lib/feedback.ts and the shell's src-tauri/src/feedback.rs), in every
# copy already installed, so keep both.
name: Question
description: Something you'd like to know about Strandivo
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Your Strandivo version and computer, or what you're trying to do.

name: Build installers

# A full set of installers takes most of an hour, so they are built only when asked for:
#   - pushing a version tag like v0.2.0 (builds everything and drafts a GitHub Release), or
#   - Actions tab → "Build installers" → "Run workflow" (choose which platforms).
# Download the result from the run page, under "Artifacts".
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options:
          - mac-apple-silicon
          - mac
          - windows
          - linux
          - all
        default: mac-apple-silicon
  push:
    tags: ["v*"]

# Read-only unless a job says otherwise: only drafting the release writes.
permissions:
  contents: read

jobs:
  plan:
    name: Choose platforms
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        env:
          CHOICE: ${{ github.event_name == 'push' && 'all' || inputs.platforms }}
        run: |
          arm='{"name":"macOS (Apple Silicon)","os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg","artifact":"mac-apple-silicon"}'
          intel='{"name":"macOS (Intel)","os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg","artifact":"mac-intel"}'
          win='{"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis","artifact":"windows"}'
          linux='{"name":"Linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage","artifact":"linux"}'
          case "$CHOICE" in
            mac-apple-silicon) list="[$arm]" ;;
            mac) list="[$arm,$intel]" ;;
            windows) list="[$win]" ;;
            linux) list="[$linux]" ;;
            *) list="[$arm,$intel,$win,$linux]" ;;
          esac
          echo "include=$list" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q -o Acquire::Retries=3 libwebkit2gtk-4.1-dev librsvg2-dev patchelf libfuse2

      - name: Install JavaScript dependencies
        shell: bash
        run: .github/scripts/run.sh "npm install" npm install --no-audit --no-fund

      - name: Build app
        shell: bash
        run: .github/scripts/run.sh "Build ${{ matrix.name }}" npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: strandivo-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true

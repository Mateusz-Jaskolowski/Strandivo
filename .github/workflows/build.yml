name: Build installers

# A full set of installers takes most of an hour, so they are built only when asked for:
#   - pushing a version tag like v0.2.0: every platform, signed, with the update files and
#     latest.json, and a draft GitHub Release. Publishing the draft is what gives the update
#     to installed copies, through updates.strandivo.com. GitHub also keeps a signed record
#     of the commit and run that built each published file, for `gh attestation verify`.
#   - Actions tab → "Build installers" → "Run workflow": the platforms you pick, unsigned and
#     without update files, for testing. Download them from the run page, under "Artifacts".
#
# The update signing key is a secret of the `release` environment only: v* tags may use it,
# a maintainer approves each run, and only maintainers may create v* tags. So only the
# signed build jobs below ever hold it, never a pull request or a manual run. Third-party
# actions are pinned to commits, since they run beside the key.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options:
          - mac-apple-silicon
          - mac
          - windows
          - linux
          - all
        default: mac-apple-silicon
  push:
    tags: ["v*"]

# Read-only unless a job says otherwise: only drafting the release, and recording how its
# files were built, write.
permissions:
  contents: read

jobs:
  plan:
    name: Choose platforms
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        env:
          CHOICE: ${{ github.event_name == 'push' && 'all' || inputs.platforms }}
        run: |
          arm='{"name":"macOS (Apple Silicon)","os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg","artifact":"mac-apple-silicon","arch":"aarch64"}'
          intel='{"name":"macOS (Intel)","os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg","artifact":"mac-intel","arch":"x64"}'
          win='{"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis","artifact":"windows","arch":"x64"}'
          linux='{"name":"Linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage","artifact":"linux","arch":"x64"}'
          case "$CHOICE" in
            mac-apple-silicon) list="[$arm]" ;;
            mac) list="[$arm,$intel]" ;;
            windows) list="[$win]" ;;
            linux) list="[$linux]" ;;
            *) list="[$arm,$intel,$win,$linux]" ;;
          esac
          echo "include=$list" >> "$GITHUB_OUTPUT"

  # A release must say the same version everywhere, or the updater would be told one
  # thing by latest.json and another by the app it installs.
  check-version:
    name: Tag matches the version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The release script reads CHANGELOG.md with the app's own TypeScript, so Node 22.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node --experimental-strip-types .github/scripts/release.mjs check-version "$GITHUB_REF_NAME"

  build:
    name: ${{ matrix.name }} (unsigned)
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/build-app
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          artifact: ${{ matrix.artifact }}
          arch: ${{ matrix.arch }}

  build-signed:
    name: ${{ matrix.name }} (signed)
    if: github.event_name == 'push'
    needs: [plan, check-version]
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-app
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          artifact: ${{ matrix.artifact }}
          arch: ${{ matrix.arch }}
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # A variable of the `release` environment: not secret (every copy carries it), but
          # only release builds should send statistics.
          aptabase-key: ${{ vars.APTABASE_APP_KEY }}
          signing-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    name: Draft release
    needs: build-signed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Each file gets the name it is published under, which says its system and has no
      # version, so strandivo.com/download needs no change per release. The short notes in
      # CHANGELOG.md go in latest.json, for "What's new" in the app; the whole section is
      # the release's text.
      - name: Name the files, write latest.json and the release notes
        run: |
          node --experimental-strip-types .github/scripts/release.mjs name-files dist "$GITHUB_REF_NAME"
          node --experimental-strip-types .github/scripts/release.mjs latest-json dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > dist/latest.json
          node --experimental-strip-types .github/scripts/release.mjs release-notes "$GITHUB_REF_NAME" > notes.md
      # The published files' SHA-256 fingerprints, which the attest job below signs.
      - name: Take the files' fingerprints
        id: digests
        working-directory: dist
        run: |
          {
            echo "digests<<EOF"
            sha256sum *.dmg *.exe *.deb *.AppImage *.app.tar.gz latest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # A release candidate (v0.4.0-rc.1) is drafted as a pre-release, which GitHub never
      # makes "latest": the updates Worker and the Download page follow "latest", so no copy
      # is offered it, even if it is published by mistake as it is.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.app.tar.gz
            dist/latest.json
          body_path: notes.md

  # A signed record, kept by GitHub, of the commit and run that built each published file,
  # so anyone can check a download with `gh attestation verify` (the Download page says how).
  # A job of its own, as any step of a job allowed an id-token could sign any file as built
  # here: this one runs only GitHub's own action, on the fingerprints the release job took.
  # It comes after the draft, so its failure never stops a release; re-run it instead.
  attest:
    name: Record how the files were built
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Write down the fingerprints
        env:
          DIGESTS: ${{ needs.release.outputs.digests }}
        run: printf '%s\n' "$DIGESTS" > digests.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: digests.txt

name: Deploy browser version

# Puts the browser version (dist-web, `npm run build:web`) on Cloudflare Pages, in the
# project `strandivo-app` (part 5 of docs/web-version-plan.md):
#   - publishing a release: app.strandivo.com, so the browser version and the installers
#     are always the same version. Only a published release, not a merge to main, so a
#     feature built over several pull requests never reaches anyone half done.
#   - publishing a pre-release (a release candidate): the preview address `next`
#     (next.strandivo-app.pages.dev), never app.strandivo.com, as installed copies are
#     never offered one either.
#   - Actions tab → "Deploy browser version" → "Run workflow" on a branch: that branch's
#     preview address (main's is main-preview), to try it before a release.
# Re-running a release's run deploys that release again.
#
# The Cloudflare token can only deploy Pages, and is a secret of the `web` environment,
# beside two variables: the account's id and the usage statistics key (the desktop's).
# This job can't write to the repository, and its third-party code is pinned, as it runs
# beside the token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name == 'release' && (github.event.release.prerelease && 'next' || 'production') || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment: web
    timeout-minutes: 20
    steps:
      - name: Choose where it goes
        id: where
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = release ] && [ "$PRERELEASE" = false ]; then
            # Pages' production branch is main: this is app.strandivo.com.
            echo "branch=main" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"; echo "release=1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = release ]; then
            echo "branch=next" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"; echo "release=0" >> "$GITHUB_OUTPUT"
          else
            # A preview named for the branch; main's must not be "main", which is production.
            name="$REF_NAME"; [ "$name" = main ] && name=main-preview
            echo "branch=$name" >> "$GITHUB_OUTPUT"; echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"; echo "release=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.where.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          targets: wasm32-unknown-unknown

      - name: Install
        run: .github/scripts/run.sh "npm install" npm install --no-audit --no-fund

      - name: Unit tests
        run: .github/scripts/run.sh "Interface logic tests" npm test

      - name: Build
        env:
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}
          STRANDIVO_RELEASE: ${{ steps.where.outputs.release }}
        run: .github/scripts/run.sh "Build browser version" npm run build:web

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.where.outputs.branch }}
        run: .github/scripts/run.sh "Deploy to Cloudflare Pages" npx --yes wrangler@4.151.3 pages deploy dist-web --project-name strandivo-app --branch "$BRANCH"

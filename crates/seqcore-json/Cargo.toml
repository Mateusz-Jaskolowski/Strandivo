[package]
name = "seqcore-json"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "What the interface sees of seqcore: its requests and responses as JSON, shared by the desktop shell and the WebAssembly build"

# serde and serde_json only. They are why this is not part of seqcore, which stays
# dependency-free.
[dependencies]
seqcore = { path = "../seqcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

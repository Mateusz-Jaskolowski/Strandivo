[package]
name = "strandivo"
version = "0.1.0"
description = "Free, open-source plasmid editor: maps, primers, cloning and sequence verification"
edition = "2021"
license = "GPL-3.0-or-later"
homepage = "https://strandivo.com"
repository = "https://github.com/Mateusz-Jaskolowski/Strandivo"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seqcore = { path = "../crates/seqcore" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Thin LTO keeps release builds (and CI minutes) short; the speed difference is negligible here.
[profile.release]
lto = "thin"
opt-level = 3
strip = true
panic = "abort"

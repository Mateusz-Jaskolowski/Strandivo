[package]
name = "strandivo"
version = "0.3.0"
description = "Free, open-source plasmid editor: maps, primers, cloning and sequence verification"
edition = "2021"
license = "GPL-3.0-or-later"
homepage = "https://strandivo.com"
repository = "https://github.com/Mateusz-Jaskolowski/Strandivo"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seqcore-json = { path = "../crates/seqcore-json" }
# The system's version for a feedback report (src/feedback.rs).
os_info = { version = "3", default-features = false }
# Usage statistics (src/usage.rs); the updater already brings it in, with its TLS.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# reqwest is built without a TLS provider (the updater's `rustls-no-provider`) and panics
# building a client before one is installed; `install_tls_provider` in src/lib.rs installs
# the same one the updater does. Already in the tree, so no new crates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Thin LTO keeps release builds (and CI minutes) short; the speed difference is negligible here.
[profile.release]
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
